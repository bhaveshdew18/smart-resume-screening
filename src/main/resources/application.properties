spring.application.name=smart-resume-screening

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resume}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.temperature=0.2

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

management.endpoints.web.exposure.include=health,info